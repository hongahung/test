<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E47">
<title>擲骰子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1F4E47; --felt-deep:#153731; --ivory:#F6F0E1; --ivory-edge:#D9CFB6;
  --brass:#D4B25C; --ink:#EDE6D3; --muted:#9FB8B1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --felt:#173D37; --felt-deep:#0F2B27; } }
:root[data-theme="dark"]{ --felt:#173D37; --felt-deep:#0F2B27; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 80% at 50% 35%, var(--felt) 0%, var(--felt-deep) 100%);
  background-color:var(--felt-deep);
  color:var(--ink);
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  overflow:hidden;
}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
h1{font-size:1.1rem;font-weight:500;margin:0;letter-spacing:.08em;color:var(--muted)}
.count{display:flex;align-items:center;gap:6px}
.count button{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brass);
  background:transparent;color:var(--brass);font-size:1.3rem;line-height:1;cursor:pointer;font-family:inherit
}
.count button:disabled{opacity:.3}
.tools{display:flex;align-items:center;gap:12px}
#sound{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brass);
  background:transparent;color:var(--brass);font-size:1rem;line-height:1;cursor:pointer;font-family:inherit
}
#sound.off{opacity:.35}
.count span{min-width:4.2em;text-align:center;font-size:.95rem}

#total{
  text-align:center;font-weight:900;font-size:clamp(4.5rem,24vw,8rem);line-height:1;
  margin:14px 0 0;color:var(--ivory);font-variant-numeric:tabular-nums;transition:opacity .15s;
}
#total.rolling{opacity:.25}
.meterwrap{width:120px;height:4px;margin:8px auto 0;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#meter{height:100%;background:var(--brass);transform:scaleX(0);transform-origin:left;transition:transform .08s linear}
[hidden]{display:none!important}
#hint{text-align:center;font-size:.85rem;color:var(--muted);margin:6px 0 0;min-height:1.3em}

#table{
  flex:1;position:relative;margin:12px 14px;border-radius:22px;
  border:2px solid rgba(212,178,92,.35);
  box-shadow:inset 0 0 40px rgba(0,0,0,.35);
  cursor:grab;touch-action:none;overflow:hidden;
  perspective:900px;perspective-origin:50% 45%;
}
#table:active{cursor:grabbing}
.die{
  --s:clamp(58px,19vw,84px); --z:0;
  position:absolute;left:0;top:0;width:var(--s);height:var(--s);
  padding:0;border:none;background:none;cursor:pointer;
  transform-style:preserve-3d;will-change:transform;
  -webkit-touch-callout:none;
}
.die:focus-visible{outline:3px solid var(--brass);outline-offset:4px}

/* the cast shadow lies flat under the cube and spreads as the die lifts */
.shadow{
  position:absolute;left:0;top:0;width:100%;height:100%;border-radius:22%;
  background:#000;
  transform:translateZ(calc(var(--s) / -2)) translateY(calc(4px + var(--z) * .45px));
  filter:blur(calc(5px + var(--z) * .07px));
  opacity:calc(.5 - var(--z) * .0011);
}
.cube{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d}
.cube.settle{transition:transform .32s cubic-bezier(.2,.8,.3,1)}
.face{
  position:absolute;left:0;top:0;width:100%;height:100%;border-radius:16%;
  background:linear-gradient(145deg,#fffaf0 0%,var(--ivory) 55%,var(--ivory-edge) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08), inset 0 -7px 12px rgba(0,0,0,.10);
  backface-visibility:hidden;
}
.face svg{display:block;width:100%;height:100%;pointer-events:none}
/* opposite faces sum to 7, as on a real die */
.f1{transform:translateZ(calc(var(--s) / 2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.f3{transform:rotateY(90deg)  translateZ(calc(var(--s) / 2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.f5{transform:rotateX(90deg)  translateZ(calc(var(--s) / 2))}
.f2{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.die.held .face{box-shadow:inset 0 0 0 3px var(--brass)}
.die.held::after{
  content:"保留";position:absolute;left:50%;top:100%;transform:translate(-50%,6px);
  font-size:.75rem;color:var(--brass);white-space:nowrap;font-family:inherit
}

footer{padding:0 18px 18px}
#history{
  display:flex;gap:10px;overflow-x:auto;padding:0 0 12px;font-size:.9rem;color:var(--muted);
  scrollbar-width:none;font-variant-numeric:tabular-nums;min-height:2em
}
#history span:first-child{color:var(--ink)}
.actions{display:flex;gap:10px}
#roll{
  flex:1;height:60px;border-radius:30px;border:none;background:var(--brass);color:#2A220E;
  font-family:inherit;font-weight:900;font-size:1.3rem;letter-spacing:.3em;cursor:pointer;
  box-shadow:0 4px 0 #9C823F;
}
#roll:active{transform:translateY(3px);box-shadow:0 1px 0 #9C823F}
#shake{
  width:60px;height:60px;border-radius:50%;border:1.5px solid var(--brass);background:transparent;
  color:var(--brass);font-family:inherit;font-size:.8rem;cursor:pointer;line-height:1.2
}
#shake[aria-pressed="true"]{background:rgba(212,178,92,.18)}
button:focus-visible{outline:3px solid var(--ivory);outline-offset:3px}
</style>
</head>
<body>
<header>
  <h1>擲骰子</h1>
  <div class="tools">
    <button id="sound" aria-pressed="true" aria-label="音效開關">♪</button>
    <div class="count">
      <button id="minus" aria-label="減少骰子">−</button>
      <span id="countLabel">2 顆</span>
      <button id="plus" aria-label="增加骰子">+</button>
    </div>
  </div>
</header>

<div id="total" aria-live="polite">–</div>
<div class="meterwrap" hidden><div id="meter"></div></div>
<p id="hint">在桌面上用手滑動來擲骰，滑越用力滾越久</p>

<div id="table" role="group" aria-label="骰子桌"></div>

<footer>
  <div id="history" aria-label="最近結果"></div>
  <div class="actions">
    <button id="shake" aria-pressed="false">搖一搖<br>關</button>
    <button id="roll">擲</button>
  </div>
</footer>

<script>
const LAYOUT = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const POS = [[25,25],[50,25],[75,25],[25,50],[50,50],[75,50],[25,75],[50,75],[75,75]];
// how far to turn the cube so a given number ends up facing the viewer: [rotateX, rotateY]
const SHOW = {1:[0,0], 2:[90,0], 3:[0,-90], 4:[0,90], 5:[-90,0], 6:[0,180]};
const table = document.getElementById('table');
const totalEl = document.getElementById('total');
const hint = document.getElementById('hint');
const histEl = document.getElementById('history');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let count = 2, dice = [], history = [], rolling = false, S = 70, track = [], soundOn = true;

try {
  const saved = JSON.parse(localStorage.getItem('dice-state') || '{}');
  if (saved.count) count = saved.count;
  if (Array.isArray(saved.history)) history = saved.history;
  if (saved.sound === false) soundOn = false;
} catch(e){}
function save(){ try{ localStorage.setItem('dice-state', JSON.stringify({count, history, sound: soundOn})); }catch(e){} }

function rand6(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 6) + 1; }
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- sound ----------
   Every dice sound is synthesised from one short noise buffer, so the page
   stays a single file with nothing to download. */
let actx = null, noiseBuf = null, lastClack = 0, silentEl = null, audioBlocked = false;

// iOS silences Web Audio while the ringer switch is off unless a media element
// is playing, so loop a silent clip to keep the audio session audible.
function silentClip(){
  const rate = 8000, n = rate * 0.2;
  const buf = new Uint8Array(44 + n);
  const dv = new DataView(buf.buffer);
  const tag = (o, t) => { for (let i = 0; i < t.length; i++) buf[o + i] = t.charCodeAt(i); };
  tag(0, 'RIFF'); dv.setUint32(4, 36 + n, true); tag(8, 'WAVEfmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
  dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  tag(36, 'data'); dv.setUint32(40, n, true);
  buf.fill(128, 44);                                  // 128 is silence in 8-bit PCM
  const el = document.createElement('audio');
  el.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  el.loop = true;
  el.playsInline = true;
  el.setAttribute('playsinline', '');
  return el;
}

// MUST run synchronously inside a user gesture the first time: Safari only
// honours resume() while the gesture is still being handled, so anything
// deferred (a setTimeout, a physics callback) is too late and stays silent.
function ensureAudio(){
  if (!soundOn) return null;
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      const len = Math.floor(actx.sampleRate * 0.12);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (!silentEl) silentEl = silentClip();
    if (silentEl.paused) silentEl.play().catch(() => {});
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    audioBlocked = actx.state !== 'running';
    return actx;
  } catch(e){ return null; }
}

// Say why it is quiet instead of just being quiet.
function audioNote(){
  if (!soundOn) return '';
  if (!actx) return '這個瀏覽器不支援音效';
  if (actx.state !== 'running') return '瀏覽器擋住了音效，再按一次「擲」';
  return '';
}

// One knock: noise through a bandpass, shaped by a very short decay.
function clack(strength, pitch){
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  if (now - lastClack < 0.012) return;        // dense collisions would pile up
  lastClack = now;
  const v = Math.min(1, Math.max(0.1, strength));
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = rnd(0.85, 1.25);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = rnd(1400, 2400) * (pitch || 1);
  bp.Q.value = 1.4;
  const g = ctx.createGain();
  const dur = 0.05 + v * 0.05;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.3 * v, now + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(now);
  src.stop(now + dur + 0.02);
}

// The dice knocking together as they leave the hand.
function rattle(power){
  clack(rnd(0.3, 0.6), 1.15);           // now, while the gesture can still unlock audio
  let t = 0;
  for (let i = 0, n = 2 + Math.round(power); i < n; i++){
    t += rnd(28, 55);
    setTimeout(() => clack(rnd(0.3, 0.6), 1.15), t);
  }
}

function pips(v){
  const color = (v === 1 || v === 4) ? '#C8102E' : '#1B1B1B';
  const r = v === 1 ? 13 : 9;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${
    LAYOUT[v].map(i => `<circle cx="${POS[i][0]}" cy="${POS[i][1]}" r="${r}" fill="${color}"/>`).join('')
  }</svg>`;
}

// The pips no longer change: all six faces exist, so the value is whichever
// one the cube happens to be turned towards.
function face(d, v){
  d.face = v;
  d.el.setAttribute('aria-label', `點數 ${v}${d.held ? '，已保留' : ''}`);
}

// Turn the cube so v faces the viewer, by the shortest way round from where
// it already is, so a die never unwinds a dozen turns to land.
function rest(d, v){
  const [tx, ty] = SHOW[v];
  d.rx = tx + Math.round((d.rx - tx) / 360) * 360;
  d.ry = ty + Math.round((d.ry - ty) / 360) * 360;
  face(d, v);
}

function draw(d){
  const lift = 1 + d.z / 500;
  d.el.style.transform = `translate(${d.x}px, ${d.y - d.z * .6}px) scale(${lift})`;
  d.el.style.setProperty('--z', d.z.toFixed(1));
  d.el.style.zIndex = d.z > 1 ? 10 : 1;
  d.cube.style.transform = `rotateZ(${d.rz.toFixed(1)}deg) rotateX(${d.rx.toFixed(1)}deg) rotateY(${d.ry.toFixed(1)}deg)`;
}

function bounds(){ return { w: table.clientWidth - S, h: table.clientHeight - S }; }

function build(){
  table.innerHTML = '';
  const old = dice; dice = [];
  const probe = document.createElement('div'); probe.className = 'die'; table.appendChild(probe);
  S = probe.offsetWidth; probe.remove();
  const { w, h } = bounds();
  const cols = Math.min(count, 3), rows = Math.ceil(count / 3), gap = S * 0.35;
  const gw = cols * S + (cols - 1) * gap, gh = rows * S + (rows - 1) * gap;
  for (let i = 0; i < count; i++){
    const el = document.createElement('button');
    el.className = 'die';
    const shadow = document.createElement('span');
    shadow.className = 'shadow';
    const cube = document.createElement('span');
    cube.className = 'cube';
    cube.innerHTML = [1,2,3,4,5,6].map(v => `<span class="face f${v}">${pips(v)}</span>`).join('');
    el.append(shadow, cube);
    const d = { el, cube, held:false, face:1, target:1, x:0, y:0, z:0,
                rx:0, ry:0, rz:rnd(-12,12), vx:0, vy:0, vz:0, vrz:0, tx:0, ty:0 };
    const c = i % 3, r = Math.floor(i / 3);
    d.x = (w + S - gw) / 2 + c * (S + gap);
    d.y = (h + S - gh) / 2 + r * (S + gap);
    // Long-press (0.5s) to hold a die. Plain taps and swipes never hold,
    // so every die always joins the throw unless you deliberately keep it.
    let pressTimer = null, pressStart = null;
    el.addEventListener('pointerdown', e => {
      pressStart = { x: e.clientX, y: e.clientY };
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        pressTimer = null;
        if (rolling) return;
        track = [];                       // cancel the swipe that started here
        d.held = !d.held;
        el.classList.toggle('held', d.held);
        face(d, d.face);
        if (navigator.vibrate) navigator.vibrate(25);
        hint.textContent = d.held ? '已保留這顆，長按可取消' : '已取消保留';
      }, 500);
    });
    el.addEventListener('pointermove', e => {
      if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10){
        clearTimeout(pressTimer); pressTimer = null;
      }
    });
    ['pointerup','pointercancel','pointerleave'].forEach(t =>
      el.addEventListener(t, () => { clearTimeout(pressTimer); pressTimer = null; }));
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('contextmenu', e => e.preventDefault());
    rest(d, old[i]?.face || rand6());
    draw(d);
    table.appendChild(el);
    dice.push(d);
  }
  document.getElementById('countLabel').textContent = `${count} 顆`;
  document.getElementById('minus').disabled = count <= 1;
  document.getElementById('plus').disabled = count >= 6;
  totalEl.textContent = '–';
  save();
}

function renderHistory(){ histEl.innerHTML = history.map(h => `<span>${h}</span>`).join(''); }

/* ---------- physics ---------- */
const FRICTION = 1.5;        // ground drag, per second
const GRAVITY = 2600;        // px/s² for the hop height
const STOP = 25;             // px/s: below this a die settles

function roll(vec){
  if (rolling) return;
  const movers = dice.filter(d => !d.held);
  if (!movers.length){ hint.textContent = '全部都保留了，長按骰子取消保留'; return; }

  // power: 0.4 (gentle flick) to 3 (hard fling) — scales speed, hop and spin
  let dirX, dirY, power;
  if (vec){
    const len = Math.hypot(vec.dx, vec.dy) || 1;
    dirX = vec.dx / len; dirY = vec.dy / len;
    power = Math.min(3, Math.max(0.4, vec.speed));
  } else {
    const t = rnd(0, Math.PI * 2);
    dirX = Math.cos(t); dirY = Math.sin(t); power = rnd(0.9, 1.4);
  }

  rolling = true;
  totalEl.classList.add('rolling');
  hint.textContent = '滾動中…';
  rattle(power);
  if (navigator.vibrate) navigator.vibrate(20);

  movers.forEach(d => { d.target = rand6(); });   // decided now, revealed when they stop

  if (reduceMotion){
    const { w, h } = bounds();
    movers.forEach(d => { d.x = rnd(0, w); d.y = rnd(0, h); d.rz = rnd(-30, 30); });
    return finish();
  }

  const speed = 520 * power;
  movers.forEach(d => {
    const spread = rnd(-0.45, 0.45);
    const cx = dirX * Math.cos(spread) - dirY * Math.sin(spread);
    const cy = dirX * Math.sin(spread) + dirY * Math.cos(spread);
    const k = rnd(0.8, 1.2);
    d.vx = cx * speed * k; d.vy = cy * speed * k;
    d.vz = rnd(380, 560) * Math.sqrt(power);
    d.vrz = rnd(-160, 160) * power;
    d.tx = rnd(-320, 320) * power;      // free tumble, only while it is off the felt
    d.ty = rnd(-320, 320) * power;
    d.cube.classList.remove('settle');
  });

  let last = performance.now();
  function step(now){
    const dt = Math.min(0.032, (now - last) / 1000); last = now;
    const { w, h } = bounds();
    const drag = Math.exp(-FRICTION * dt);
    const k = 90 / S;        // rolling one face-width across the felt is a quarter turn

    for (const d of movers){
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.rx += (-d.vy * k + (d.z > 0 ? d.tx : 0)) * dt;
      d.ry += ( d.vx * k + (d.z > 0 ? d.ty : 0)) * dt;
      d.rz += d.vrz * dt;

      // hops: each landing loses energy and turns the die to a new face
      if (d.z > 0 || d.vz > 0){
        d.vz -= GRAVITY * dt; d.z += d.vz * dt;
        if (d.z <= 0){
          d.z = 0;
          const impact = Math.abs(d.vz);        // read before the bounce rewrites it
          const moving = Math.hypot(d.vx, d.vy);
          d.vz = d.vz < -90 && moving > 60 ? -d.vz * 0.55 : 0;
          d.tx *= 0.45; d.ty *= 0.45;          // each landing knocks the tumble out of it
          if (impact > 40) clack(impact / 500, 1);
          if (d.vz && navigator.vibrate) navigator.vibrate(4);
        }
      }

      // extra drag when on the ground
      const g = d.z > 0 ? Math.exp(-0.3 * dt) : drag;
      d.vx *= g; d.vy *= g; d.vrz *= drag;

      // walls
      if (d.x < 0){ d.x = 0; d.vx = Math.abs(d.vx) * 0.7; d.vrz += rnd(-200, 200); }
      if (d.x > w){ d.x = w; d.vx = -Math.abs(d.vx) * 0.7; d.vrz += rnd(-200, 200); }
      if (d.y < 0){ d.y = 0; d.vy = Math.abs(d.vy) * 0.7; d.vrz += rnd(-200, 200); }
      if (d.y > h){ d.y = h; d.vy = -Math.abs(d.vy) * 0.7; d.vrz += rnd(-200, 200); }
    }

    // die-to-die collisions (held dice act as fixed obstacles)
    const R = S * 0.95;
    for (let i = 0; i < dice.length; i++){
      for (let j = i + 1; j < dice.length; j++){
        const A = dice[i], B = dice[j];
        if (A.held && B.held) continue;
        if (Math.abs(A.z - B.z) > S * 0.6) continue;   // one flew over the other
        const dx = B.x - A.x, dy = B.y - A.y, dist = Math.hypot(dx, dy);
        if (dist >= R || dist === 0) continue;
        const nx = dx / dist, ny = dy / dist, overlap = R - dist;
        if (A.held){ B.x += nx * overlap; B.y += ny * overlap; }
        else if (B.held){ A.x -= nx * overlap; A.y -= ny * overlap; }
        else { A.x -= nx * overlap / 2; A.y -= ny * overlap / 2; B.x += nx * overlap / 2; B.y += ny * overlap / 2; }
        const rv = (A.held ? 0 : A.vx * nx + A.vy * ny) - (B.held ? 0 : B.vx * nx + B.vy * ny);
        if (rv <= 0) continue;
        const imp = rv * 0.85;
        if (imp > 40) clack(imp / 600, 1.25);
        if (A.held){ B.vx += nx * imp * 2; B.vy += ny * imp * 2; }
        else if (B.held){ A.vx -= nx * imp * 2; A.vy -= ny * imp * 2; }
        else { A.vx -= nx * imp; A.vy -= ny * imp; B.vx += nx * imp; B.vy += ny * imp; }
        if (!A.held) A.vrz += rnd(-260, 260);
        if (!B.held) B.vrz += rnd(-260, 260);
      }
    }

    movers.forEach(draw);

    const still = movers.every(d => d.z === 0 && d.vz === 0 && Math.hypot(d.vx, d.vy) < STOP);
    if (still){ movers.forEach(d => { d.vx = d.vy = d.vrz = 0; }); finish(); }
    else requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function finish(){
  dice.filter(d => !d.held).forEach(d => {
    if (!reduceMotion) d.cube.classList.add('settle');
    rest(d, d.target);
    draw(d);
  });
  const sum = dice.reduce((s, d) => s + d.face, 0);
  totalEl.textContent = sum;
  totalEl.classList.remove('rolling');
  hint.textContent = audioNote() || (count > 1 ? dice.map(d => d.face).join(' + ') : '長按骰子可以保留');
  history.unshift(sum); history = history.slice(0, 20);
  renderHistory(); save();
  if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
  rolling = false;
}

/* ---------- input ---------- */
const soundBtn = document.getElementById('sound');
function renderSound(){
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.classList.toggle('off', !soundOn);
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  renderSound(); save();
  if (soundOn){
    ensureAudio();
    clack(0.5, 1);                                  // let you hear what you switched on
  } else {
    if (silentEl) silentEl.pause();
    if (actx) { try { actx.suspend(); } catch(e){} }
  }
  hint.textContent = soundOn ? (audioNote() || '音效已開啟') : '音效已關閉';
});
renderSound();

document.getElementById('roll').addEventListener('click', () => { ensureAudio(); roll(); });
document.getElementById('minus').addEventListener('click', () => { if (count > 1 && !rolling){ count--; build(); } });
document.getElementById('plus').addEventListener('click', () => { if (count < 6 && !rolling){ count++; build(); } });

// Swipe: track the last ~80ms of movement so the flick at release sets the power
table.addEventListener('pointerdown', e => {
  ensureAudio();        // the swipe itself ends too late to unlock audio
  track = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
});
table.addEventListener('pointermove', e => {
  if (!track.length) return;
  const now = performance.now();
  track.push({ x: e.clientX, y: e.clientY, t: now });
  while (track.length > 2 && now - track[0].t > 80) track.shift();
});
table.addEventListener('pointerup', e => {
  if (!track.length) return;
  const now = performance.now();
  track.push({ x: e.clientX, y: e.clientY, t: now });
  const first = track[0], lastP = track[track.length - 1];
  const dx = lastP.x - first.x, dy = lastP.y - first.y;
  const dist = Math.hypot(dx, dy), dt = Math.max(8, lastP.t - first.t);
  track = [];
  if (dist < 30) return;                 // a tap, not a swipe
  roll({ dx, dy, speed: dist / dt });    // px per ms ≈ power
});
table.addEventListener('pointercancel', () => { track = []; });

// Shake to roll
const shakeBtn = document.getElementById('shake');
const meter = document.getElementById('meter');
let shakeOn = false, lastShake = 0, gotMotion = false, noDataTimer = null;
let gx = 0, gy = 0, gz = 0, peak = null;   // gravity estimate + current shake peak

function onMotion(e){
  gotMotion = true;
  let x, y, z;
  if (e.acceleration && e.acceleration.x != null){
    ({ x, y, z } = e.acceleration);          // gravity already removed
  } else if (e.accelerationIncludingGravity){
    const g = e.accelerationIncludingGravity; // strip gravity with a low-pass filter
    gx = gx * .85 + (g.x||0) * .15; gy = gy * .85 + (g.y||0) * .15; gz = gz * .85 + (g.z||0) * .15;
    x = (g.x||0) - gx; y = (g.y||0) - gy; z = (g.z||0) - gz;
  } else return;
  x = x || 0; y = y || 0; z = z || 0;
  const mag = Math.hypot(x, y, z);
  meter.style.transform = `scaleX(${Math.min(1, mag / 25)})`;

  const now = Date.now();
  if (rolling || now - lastShake < 1000) return;
  if (mag > 11){
    // keep the strongest sample of this shake, then throw once it calms down
    if (!peak || mag > peak.mag) peak = { mag, x, y, t: now };
  } else if (peak && now - peak.t > 60){
    lastShake = now;
    roll({ dx: -peak.x, dy: peak.y, speed: Math.min(3, Math.max(0.6, peak.mag / 12)) });
    peak = null;
  }
}

shakeBtn.addEventListener('click', async () => {
  if (!shakeOn){
    if (!('DeviceMotionEvent' in window)){ hint.textContent = '這台裝置不支援搖一搖'; return; }
    if (typeof DeviceMotionEvent.requestPermission === 'function'){
      try {
        const p = await DeviceMotionEvent.requestPermission();
        if (p !== 'granted'){ hint.textContent = '沒有取得動作感測權限，請到設定允許後再試'; return; }
      } catch(err){
        hint.textContent = '這個畫面無法要求感測權限，請用 Safari 直接開啟網址';
        return;
      }
    }
    ensureAudio();        // a shake is not a gesture iOS will unlock audio on
    gotMotion = false; peak = null;
    window.addEventListener('devicemotion', onMotion);
    shakeOn = true;
    meter.parentElement.hidden = false;
    hint.textContent = '搖動手機就會擲骰';
    clearTimeout(noDataTimer);
    noDataTimer = setTimeout(() => {
      if (shakeOn && !gotMotion)
        hint.textContent = '收不到感測資料，請複製網址到 Safari 或 Chrome 開啟';
    }, 1500);
  } else {
    window.removeEventListener('devicemotion', onMotion);
    shakeOn = false;
    meter.parentElement.hidden = true;
    hint.textContent = '搖一搖已關閉';
  }
  shakeBtn.setAttribute('aria-pressed', shakeOn);
  shakeBtn.innerHTML = `搖一搖<br>${shakeOn ? '開' : '關'}`;
});

// keep dice on the table if the screen rotates
addEventListener('resize', () => {
  const { w, h } = bounds();
  dice.forEach(d => { d.x = Math.min(Math.max(0, d.x), w); d.y = Math.min(Math.max(0, d.y), h); draw(d); });
});

build();
renderHistory();
</script>
</body>
