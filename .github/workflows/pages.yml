name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pages serves the gh-pages branch, so mirror master onto it; the push
      # is what makes GitHub rebuild the site.
      - name: Mirror master onto gh-pages
        run: git push --force origin HEAD:gh-pages
